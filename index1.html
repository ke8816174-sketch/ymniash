<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Умняша — пространство спокойствия</title>
<style>
:root{--bg:#d8d7d7;--light:#e9e8e8;--mid:#b9b6b6;--dark:#918b8c;--purple:#39264f;--ink:#080808}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;overflow:hidden;background:var(--bg);color:var(--ink)}
.page{position:relative;min-height:100svh;overflow:hidden;isolation:isolate;background:var(--bg)}
.exit{position:fixed;z-index:20;top:clamp(18px,3vw,38px);left:clamp(20px,2.5vw,38px);color:var(--ink);text-decoration:none;font-size:clamp(25px,4.2vw,64px);line-height:1;font-weight:400;transition:opacity .25s}
.exit:hover{opacity:.55}.screen{position:absolute;inset:0;display:none}.screen.active{display:block}
.breath-scene{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.breath-halo,.breath-core{position:absolute;border-radius:50%;left:50%;top:51%;transform:translate(-50%,-50%);will-change:transform,background-color}
.breath-halo{width:min(90vw,125vh);aspect-ratio:1;background:#aaa6a6;opacity:.78;box-shadow:0 0 100px 30px #ffffff14}
.breath-core{width:min(45vw,64vh);aspect-ratio:1;background:#dedddd;box-shadow:0 0 85px 18px #ffffff2b}
.breath-scene[data-phase=inhale] .breath-halo{animation:inhale 4s ease-in-out forwards}
.breath-scene[data-phase=hold] .breath-halo{transform:translate(-50%,-50%) scale(1.18)}
.breath-scene[data-phase=exhale] .breath-halo{animation:exhale 5s ease-in-out forwards}
.breath-scene[data-phase=inhale] .breath-core{animation:coreIn 4s ease-in-out forwards}
.breath-scene[data-phase=hold] .breath-core{transform:translate(-50%,-50%) scale(1.08)}
.breath-scene[data-phase=exhale] .breath-core{animation:coreOut 5s ease-in-out forwards}
@keyframes inhale{from{transform:translate(-50%,-50%) scale(.83)}to{transform:translate(-50%,-50%) scale(1.18)}}
@keyframes exhale{from{transform:translate(-50%,-50%) scale(1.18)}to{transform:translate(-50%,-50%) scale(.83)}}
@keyframes coreIn{from{transform:translate(-50%,-50%) scale(.82)}to{transform:translate(-50%,-50%) scale(1.08)}}
@keyframes coreOut{from{transform:translate(-50%,-50%) scale(1.08)}to{transform:translate(-50%,-50%) scale(.82)}}
.breath-copy{position:absolute;z-index:6;top:18%;left:50%;transform:translateX(-50%);width:100%;text-align:center;pointer-events:none}
.breath-copy h1{margin:0 0 12px;font-size:clamp(34px,4.4vw,68px);font-weight:400}
.phase{margin:0;font-size:clamp(23px,3vw,44px);font-weight:400;min-height:1.3em}
.count{position:absolute;z-index:7;top:49%;left:50%;transform:translate(-50%,-50%);font-size:clamp(60px,9vw,136px);font-weight:400;font-variant-numeric:tabular-nums;pointer-events:none}
.breath-hint{position:absolute;z-index:8;bottom:clamp(28px,5vh,60px);left:50%;transform:translateX(-50%);text-align:center;width:min(90%,520px);font-size:clamp(13px,1.2vw,17px);line-height:1.5;color:#393536}
.controls{position:fixed;z-index:20;right:clamp(20px,3vw,46px);bottom:clamp(20px,3vw,42px);display:flex;gap:12px}
.control-btn{width:clamp(54px,6vw,78px);height:clamp(54px,6vw,78px);border:0;border-radius:50%;background:var(--purple);color:white;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 28px #2819372e;transition:transform .25s,background .25s,box-shadow .25s}
.control-btn:hover{transform:scale(1.08);background:#594071;box-shadow:0 10px 32px #28193747}
.control-btn:focus-visible,.exit:focus-visible{outline:3px solid white;outline-offset:5px}.control-btn svg{width:32px;height:32px}
.pendulum-scene{position:absolute;inset:0;display:grid;place-items:center}
.pendulum-stage{position:relative;width:min(90vw,1120px);height:min(75vh,720px);margin-top:7vh}
.pivot{position:absolute;top:0;left:50%;width:2px;height:2px;background:#111}
.string{position:absolute;left:50%;top:0;width:1px;height:min(57vh,560px);background:#000c;transform-origin:top center;animation:swing 4.2s ease-in-out infinite}
.orb-wrap,.trail{position:absolute;top:min(57vh,560px);left:50%;width:clamp(100px,13vw,190px);height:clamp(100px,13vw,190px);margin-left:calc(clamp(100px,13vw,190px)/-2);margin-top:calc(clamp(100px,13vw,190px)/-2)}
.orb-wrap{transform-origin:center top;animation:orbSwing 4.2s ease-in-out infinite}
.orb{position:absolute;inset:0;border-radius:50%;background:#999495;animation:orbGlow 4.2s ease-in-out infinite}
.orb:before,.orb:after{content:"";position:absolute;inset:0;border-radius:50%;background:inherit;filter:blur(17px);opacity:.38;transform:translateX(-20px)}
.orb:after{transform:translateX(20px);opacity:.2}
.trail{border-radius:50%;background:#999495;opacity:.16;filter:blur(25px);animation:trailSwing 4.2s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-29deg)}50%{transform:rotate(29deg)}}
@keyframes orbSwing{0%,100%{transform:translateX(-245px)}50%{transform:translateX(245px)}}
@keyframes trailSwing{0%,100%{transform:translateX(-270px) scale(.9);opacity:.1}50%{transform:translateX(270px) scale(1.08);opacity:.24}}
@keyframes orbGlow{0%,100%{box-shadow:-35px 0 55px #ffffff3b}50%{box-shadow:35px 0 55px #ffffff3b}}
.pendulum-caption{position:absolute;top:18%;left:50%;transform:translateX(-50%);text-align:center;font-size:clamp(25px,3vw,42px);white-space:nowrap}
.pendulum-caption small{display:block;margin-top:12px;font-size:clamp(14px,1.3vw,18px);color:#454142}
.back-control{left:clamp(20px,3vw,46px);right:auto}
@media(max-width:650px){.breath-copy{top:17%}.breath-halo{width:112vw}.breath-core{width:66vw}.count{top:51%}.pendulum-stage{width:100vw;height:65vh;margin-top:14vh}.string{height:43vh}.orb-wrap,.trail{top:43vh}
@keyframes orbSwing{0%,100%{transform:translateX(-30vw)}50%{transform:translateX(30vw)}}
@keyframes trailSwing{0%,100%{transform:translateX(-33vw) scale(.9);opacity:.1}50%{transform:translateX(33vw) scale(1.08);opacity:.24}}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<main class="page">
<a class="exit" href="index.html" aria-label="Вернуться на главную страницу">Выход</a>
<section class="screen active" id="breathing" aria-label="Практика дыхания">
 <div class="breath-scene" id="breathScene" data-phase="inhale"><div class="breath-halo"></div><div class="breath-core"></div></div>
 <div class="breath-copy"><h1>Дыхание</h1><p class="phase" id="phaseText" aria-live="polite">Вдох</p></div>
 <div class="count" id="count" aria-live="off">4</div>
 <p class="breath-hint">Следуй за кругом. Не нужно торопиться — просто побудь здесь и дыши в комфортном для себя темпе.</p>
 <div class="controls"><button class="control-btn" id="nextToPendulum" aria-label="Перейти к следующей практике" title="Следующая практика"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12h15m-6-7 7 7-7 7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</section>
<section class="screen" id="pendulum" aria-label="Практика с маятником">
 <div class="pendulum-caption">Маятник<small>Наблюдай за движением. Позволь вниманию следовать за ним.</small></div>
 <div class="pendulum-scene"><div class="pendulum-stage"><div class="pivot"></div><div class="string"></div><div class="trail"></div><div class="orb-wrap"><div class="orb"></div></div></div></div>
 <div class="controls back-control"><button class="control-btn" id="backToBreathing" aria-label="Вернуться к дыханию" title="Предыдущая практика"><svg viewBox="0 0 24 24" fill="none"><path d="M20 12H5m6 7-7-7 7-7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>
</section>
</main>
<script>
const phases=[{key:"inhale",label:"Вдох",duration:4},{key:"hold",label:"Задержка",duration:3},{key:"exhale",label:"Выдох",duration:5}];
const scene=document.getElementById("breathScene"),phaseText=document.getElementById("phaseText"),count=document.getElementById("count");
const breathing=document.getElementById("breathing"),pendulum=document.getElementById("pendulum");
let phaseIndex=0,remaining=4,timer=null;
function showPhase(){const p=phases[phaseIndex];scene.dataset.phase=p.key;phaseText.textContent=p.label;count.textContent=remaining;}
function tick(){remaining--;if(remaining<=0){phaseIndex=(phaseIndex+1)%phases.length;remaining=phases[phaseIndex].duration;showPhase();}else count.textContent=remaining;}
function startBreathing(){clearInterval(timer);phaseIndex=0;remaining=4;showPhase();timer=setInterval(tick,1000);}
function showScreen(name){const isBreathing=name==="breathing";breathing.classList.toggle("active",isBreathing);pendulum.classList.toggle("active",!isBreathing);if(isBreathing)startBreathing();else clearInterval(timer);}
document.getElementById("nextToPendulum").addEventListener("click",()=>showScreen("pendulum"));
document.getElementById("backToBreathing").addEventListener("click",()=>showScreen("breathing"));
startBreathing();
</script>
</body>
</html>
